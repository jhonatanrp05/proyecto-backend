services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: npx prisma db push
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/sqlplatform?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/sqlplatform?schema=public
      REDIS_HOST: redis
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001,https://schema-frontend-hazel.vercel.app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: npm run start:worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/sqlplatform?schema=public
      REDIS_HOST: redis
      RUNNER_NETWORK: proyecto-backend_default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sqlplatform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d sqlplatform']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
